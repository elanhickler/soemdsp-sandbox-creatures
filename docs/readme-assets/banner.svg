<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Creature banner">
  <title>Creature</title>
  <defs>
    <linearGradient id="scanline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1113"/>
      <stop offset="100%" stop-color="#040709"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="220" rx="14" fill="url(#scanline)" stroke="#3de0ff" stroke-opacity="0.35"/>
  <rect x="10" y="10" width="880" height="200" rx="10" fill="none" stroke="#7fc7d9" stroke-opacity="0.25"/>

  <!-- pixel creature body -->
  <g transform="translate(60,55)">
    <rect x="20" y="40" width="90" height="70" rx="12" fill="#7fc7d9" fill-opacity="0.18" stroke="#7fc7d9" stroke-width="2"/>
    <rect x="35" y="20" width="60" height="30" rx="10" fill="#7fc7d9" fill-opacity="0.18" stroke="#7fc7d9" stroke-width="2"/>
    <circle cx="55" cy="35" r="4" fill="#3de0ff"/>
    <circle cx="75" cy="35" r="4" fill="#3de0ff"/>
    <path d="M55 46 Q65 54 75 46" stroke="#3de0ff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="10" y="60" width="10" height="26" rx="4" fill="#7fc7d9" fill-opacity="0.5"/>
    <rect x="110" y="60" width="10" height="26" rx="4" fill="#7fc7d9" fill-opacity="0.5"/>
    <rect x="40" y="108" width="14" height="18" rx="4" fill="#7fc7d9" fill-opacity="0.5"/>
    <rect x="76" y="108" width="14" height="18" rx="4" fill="#7fc7d9" fill-opacity="0.5"/>
  </g>

  <!-- title, DSEG-flavored blocky lettering -->
  <g transform="translate(220,70)">
    <text x="0" y="40" font-family="'Consolas','Courier New',monospace" font-size="56" font-weight="700" fill="#e2f6fb" letter-spacing="4">CREATURE</text>
    <text x="0" y="72" font-family="'Consolas','Courier New',monospace" font-size="16" fill="#7fc7d9" letter-spacing="2">an electrified tamagotchi for soemdsp-sandbox</text>
  </g>

  <!-- little LCD readout strip -->
  <g transform="translate(220,150)" font-family="'Consolas','Courier New',monospace" font-size="14" fill="#3de0ff">
    <rect x="0" y="-18" width="120" height="26" rx="4" fill="#050709" stroke="#3de0ff" stroke-opacity="0.4"/>
    <text x="10" y="0">HUNGER 30</text>
    <rect x="132" y="-18" width="120" height="26" rx="4" fill="#050709" stroke="#3de0ff" stroke-opacity="0.4"/>
    <text x="142" y="0">HEALTH 100</text>
    <rect x="264" y="-18" width="150" height="26" rx="4" fill="#050709" stroke="#e2a86d" stroke-opacity="0.5"/>
    <text x="274" y="0" fill="#e2a86d">MOOD: PEACEFUL</text>
  </g>
</svg>
