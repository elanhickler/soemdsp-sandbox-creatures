<svg viewBox="0 0 920 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The eight Creature moods">
  <title>Creature moods: Peaceful, Sad, Happy, Excited, Hungry, Angry, Fear, Meltdown</title>
  <rect x="0" y="0" width="920" height="260" fill="#040709"/>

  <!-- reusable screen frame -->
  <defs>
    <g id="screen">
      <rect x="0" y="0" width="100" height="100" rx="10" fill="#0a1113" stroke="#7fc7d9" stroke-opacity="0.35" stroke-width="2"/>
    </g>
  </defs>

  <!-- Peaceful -->
  <g transform="translate(20,20)">
    <use href="#screen"/>
    <path d="M28 45 Q38 40 48 45" stroke="#7fc7d9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M55 45 Q65 40 75 45" stroke="#7fc7d9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M35 65 Q50 74 65 65" stroke="#7fc7d9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="50" y="118" font-family="monospace" font-size="13" fill="#7fc7d9" text-anchor="middle">PEACEFUL</text>
  </g>

  <!-- Sad -->
  <g transform="translate(135,20)">
    <use href="#screen"/>
    <circle cx="38" cy="45" r="4" fill="#7fa0c7"/>
    <circle cx="65" cy="45" r="4" fill="#7fa0c7"/>
    <path d="M35 74 Q50 64 68 74" stroke="#7fa0c7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M40 52 v10" stroke="#7fa0c7" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="118" font-family="monospace" font-size="13" fill="#7fa0c7" text-anchor="middle">SAD</text>
  </g>

  <!-- Happy -->
  <g transform="translate(250,20)">
    <use href="#screen"/>
    <circle cx="38" cy="45" r="5" fill="#3de0ff"/>
    <circle cx="65" cy="45" r="5" fill="#3de0ff"/>
    <path d="M32 60 Q50 82 71 60" stroke="#3de0ff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="50" y="118" font-family="monospace" font-size="13" fill="#3de0ff" text-anchor="middle">HAPPY</text>
  </g>

  <!-- Excited -->
  <g transform="translate(365,20)">
    <use href="#screen"/>
    <path d="M33 40 l5 10 l-10 0 z" fill="#ffd166"/>
    <path d="M60 40 l5 10 l-10 0 z" fill="#ffd166"/>
    <circle cx="50" cy="66" r="10" fill="none" stroke="#ffd166" stroke-width="3"/>
    <text x="50" y="118" font-family="monospace" font-size="13" fill="#ffd166" text-anchor="middle">EXCITED</text>
  </g>

  <!-- Hungry -->
  <g transform="translate(480,20)">
    <use href="#screen"/>
    <circle cx="38" cy="45" r="4" fill="#e2a86d"/>
    <circle cx="65" cy="45" r="4" fill="#e2a86d"/>
    <path d="M32 62 q4 6 9 0 q4 6 9 0 q4 6 9 0 q4 6 9 0" stroke="#e2a86d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="50" y="118" font-family="monospace" font-size="13" fill="#e2a86d" text-anchor="middle">HUNGRY</text>
  </g>

  <!-- Angry -->
  <g transform="translate(595,20)">
    <use href="#screen"/>
    <path d="M30 38 l14 6" stroke="#e26d6d" stroke-width="3" stroke-linecap="round"/>
    <path d="M73 38 l-14 6" stroke="#e26d6d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="38" cy="50" r="4" fill="#e26d6d"/>
    <circle cx="65" cy="50" r="4" fill="#e26d6d"/>
    <path d="M32 72 l10 -6 l10 6 l10 -6 l10 6" stroke="#e26d6d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="50" y="118" font-family="monospace" font-size="13" fill="#e26d6d" text-anchor="middle">ANGRY</text>
  </g>

  <!-- Fear -->
  <g transform="translate(710,20)">
    <use href="#screen"/>
    <circle cx="38" cy="46" r="9" fill="none" stroke="#c98bd9" stroke-width="2.5"/>
    <circle cx="65" cy="46" r="9" fill="none" stroke="#c98bd9" stroke-width="2.5"/>
    <circle cx="38" cy="46" r="3" fill="#c98bd9"/>
    <circle cx="65" cy="46" r="3" fill="#c98bd9"/>
    <ellipse cx="50" cy="70" rx="6" ry="8" fill="none" stroke="#c98bd9" stroke-width="2.5"/>
    <path d="M78 32 q4 6 0 12" stroke="#8fd0e8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="50" y="118" font-family="monospace" font-size="13" fill="#c98bd9" text-anchor="middle">FEAR</text>
  </g>

  <!-- Meltdown -->
  <g transform="translate(20,150)">
    <use href="#screen"/>
    <path d="M30 38 l16 16 M46 38 l-16 16" stroke="#ff5a5a" stroke-width="3" stroke-linecap="round"/>
    <path d="M58 38 l16 16 M74 38 l-16 16" stroke="#ff5a5a" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 68 l8 -8 l8 8 l8 -8 l8 8 l8 -8 l8 8" stroke="#ff5a5a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="14" y="14" width="6" height="6" fill="#ff5a5a"/>
    <rect x="80" y="80" width="6" height="6" fill="#ff5a5a"/>
    <text x="50" y="118" font-family="monospace" font-size="13" fill="#ff5a5a" text-anchor="middle">MELTDOWN</text>
  </g>

  <text x="150" y="245" font-family="monospace" font-size="14" fill="#7fc7d9" opacity="0.6">exactly one mood shown at a time -- picked by a priority chain, not a blend</text>
</svg>
