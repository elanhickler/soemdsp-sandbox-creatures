<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Generative ambient engine diagram">
  <title>Mood-conducted generative ambient layers</title>
  <rect x="0" y="0" width="900" height="320" fill="#040709"/>

  <!-- starfield -->
  <g fill="#7fc7d9">
    <circle cx="40" cy="24" r="1.4" opacity="0.7"/>
    <circle cx="90" cy="60" r="1" opacity="0.5"/>
    <circle cx="150" cy="18" r="1.6" opacity="0.8"/>
    <circle cx="260" cy="40" r="1" opacity="0.4"/>
    <circle cx="340" cy="16" r="1.3" opacity="0.6"/>
    <circle cx="430" cy="50" r="1" opacity="0.5"/>
    <circle cx="520" cy="22" r="1.5" opacity="0.7"/>
    <circle cx="610" cy="46" r="1" opacity="0.4"/>
    <circle cx="700" cy="18" r="1.4" opacity="0.7"/>
    <circle cx="790" cy="52" r="1" opacity="0.5"/>
    <circle cx="850" cy="24" r="1.6" opacity="0.8"/>
    <circle cx="30" cy="290" r="1.2" opacity="0.5"/>
    <circle cx="120" cy="300" r="1" opacity="0.4"/>
    <circle cx="780" cy="296" r="1.3" opacity="0.6"/>
    <circle cx="860" cy="284" r="1" opacity="0.5"/>
  </g>

  <!-- mood conductor -->
  <g transform="translate(360,20)">
    <rect x="0" y="0" width="180" height="56" rx="10" fill="#0a1113" stroke="#e2a86d" stroke-opacity="0.7" stroke-width="2"/>
    <text x="90" y="24" font-family="monospace" font-size="13" fill="#e2a86d" text-anchor="middle" font-weight="700">CREATURE MOOD</text>
    <text x="90" y="42" font-family="monospace" font-size="11" fill="#e2a86d" text-anchor="middle">the conductor</text>
  </g>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fc7d9"/>
    </marker>
  </defs>

  <line x1="450" y1="76" x2="450" y2="110" stroke="#7fc7d9" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- four generative layers -->
  <g transform="translate(30,120)">
    <rect x="0" y="0" width="190" height="90" rx="10" fill="#0a1113" stroke="#3de0ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="95" y="26" font-family="monospace" font-size="13" fill="#3de0ff" text-anchor="middle" font-weight="700">DRONE BED</text>
    <text x="95" y="46" font-family="monospace" font-size="10" fill="#7fc7d9" text-anchor="middle">slow detuned oscillators</text>
    <text x="95" y="62" font-family="monospace" font-size="10" fill="#7fc7d9" text-anchor="middle">random-walk root note</text>
    <text x="95" y="78" font-family="monospace" font-size="10" fill="#7fc7d9" text-anchor="middle">inside a fixed scale</text>
  </g>

  <g transform="translate(245,120)">
    <rect x="0" y="0" width="190" height="90" rx="10" fill="#0a1113" stroke="#3de0ff" stroke-opacity="0.5" stroke-width="2"/>
    <text x="95" y="26" font-family="monospace" font-size="13" fill="#3de0ff" text-anchor="middle" font-weight="700">SPACE FIELD</text>
    <text x="95" y="46" font-family="monospace" font-size="10" fill="#7fc7d9" text-anchor="middle">filtered noise + long tails</text>
    <text x="95" y="62" font-family="monospace" font-size="10" fill="#7fc7d9" text-anchor="middle">cross-feedback reverb</text>
    <text x="95" y="78" font-family="monospace" font-size="10" fill="#7fc7d9" text-anchor="middle">for the "vast and cold" feel</text>
  </g>

  <g transform="translate(460,120)">
    <rect x="0" y="0" width="190" height="90" rx="10" fill="#0a1113" stroke="#ffd166" stroke-opacity="0.6" stroke-width="2"/>
    <text x="95" y="26" font-family="monospace" font-size="13" fill="#ffd166" text-anchor="middle" font-weight="700">ELECTRIC SPARKS</text>
    <text x="95" y="46" font-family="monospace" font-size="10" fill="#7fc7d9" text-anchor="middle">Poisson-timed transients</text>
    <text x="95" y="62" font-family="monospace" font-size="10" fill="#7fc7d9" text-anchor="middle">crackle / ring-mod bursts</text>
    <text x="95" y="78" font-family="monospace" font-size="10" fill="#7fc7d9" text-anchor="middle">rarer, denser as mood heats up</text>
  </g>

  <g transform="translate(675,120)">
    <rect x="0" y="0" width="195" height="90" rx="10" fill="#0a1113" stroke="#7fc7d9" stroke-opacity="0.5" stroke-width="2"/>
    <text x="97" y="26" font-family="monospace" font-size="13" fill="#7fc7d9" text-anchor="middle" font-weight="700">HARMONIC DRIFT</text>
    <text x="97" y="46" font-family="monospace" font-size="10" fill="#7fc7d9" text-anchor="middle">weighted random walk</text>
    <text x="97" y="62" font-family="monospace" font-size="10" fill="#7fc7d9" text-anchor="middle">over scale degrees</text>
    <text x="97" y="78" font-family="monospace" font-size="10" fill="#7fc7d9" text-anchor="middle">independent, slow LFO periods</text>
  </g>

  <line x1="125" y1="90" x2="330" y2="120" stroke="#7fc7d9" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow2)"/>
  <line x1="340" y1="90" x2="340" y2="120" stroke="#7fc7d9" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow2)"/>
  <line x1="450" y1="90" x2="555" y2="120" stroke="#7fc7d9" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow2)"/>
  <line x1="450" y1="90" x2="772" y2="120" stroke="#7fc7d9" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow2)"/>

  <!-- little creature silhouette floating in space -->
  <g transform="translate(410,230)">
    <ellipse cx="40" cy="35" rx="30" ry="24" fill="#7fc7d9" fill-opacity="0.14" stroke="#7fc7d9" stroke-width="1.5"/>
    <circle cx="32" cy="30" r="3" fill="#3de0ff"/>
    <circle cx="48" cy="30" r="3" fill="#3de0ff"/>
    <path d="M30 42 Q40 48 50 42" stroke="#3de0ff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M12 30 q-10 -6 -14 -18" stroke="#ffd166" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M68 30 q10 -6 14 -18" stroke="#ffd166" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>
  <text x="450" y="305" font-family="monospace" font-size="12" fill="#7fc7d9" text-anchor="middle" opacity="0.65">four independently-cycling layers, remixed by mood -- never quite the same twice</text>
</svg>
